<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de acervo da biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f3;--surface:#fff;--ink:#16221f;--mute:#566560;--line:#d3dbd8;--lit:#1d6b58;--lit-bg:#dcefe9;--tec:#364a8f;--tec-bg:#e1e6f6;--warn:#9c3626;--warn-bg:#f8e3df;--btn:#16221f;--btn-ink:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101615;--surface:#18201e;--ink:#e7efec;--mute:#9aaba6;--line:#2b3633;--lit:#6fd0b4;--lit-bg:#1c3a32;--tec:#a3b4f2;--tec-bg:#252f55;--warn:#f0a090;--warn-bg:#4a2620;--btn:#e7efec;--btn-ink:#101615;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101615;--surface:#18201e;--ink:#e7efec;--mute:#9aaba6;--line:#2b3633;--lit:#6fd0b4;--lit-bg:#1c3a32;--tec:#a3b4f2;--tec-bg:#252f55;--warn:#f0a090;--warn-bg:#4a2620;--btn:#e7efec;--btn-ink:#101615;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 20px}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:20px}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:1.5rem;line-height:1.2}
.stats span{color:var(--mute);font-size:.9rem}
.stats .late b{color:var(--warn)}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
.tab{font:inherit;background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;color:var(--mute)}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar input[type=search]{flex:1 1 220px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
.bar input{width:auto}
label{display:block;font-weight:700;margin:0 0 4px;font-size:.95rem}
.field{margin-bottom:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.pill:disabled{opacity:.4;cursor:not-allowed}
.pager{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.pager .gap{color:var(--mute);padding:0 2px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{font:inherit;font-weight:700;background:var(--btn);color:var(--btn-ink);border:1px solid var(--btn);border-radius:6px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--tec);outline-offset:2px}
ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);border-left:5px solid var(--line)}
.row:last-child{border-bottom:0}
.row.literatura{border-left-color:var(--lit)}
.row.tecnico{border-left-color:var(--tec)}
.row.late{border-left-color:var(--warn)}
.main{display:flex;flex-direction:column;min-width:0}
.main strong{overflow-wrap:anywhere}
.by{color:var(--mute);font-size:.92rem}
.tag{font-size:.85rem;font-weight:700;padding:2px 10px;border-radius:999px;justify-self:start}
.tag.literatura{background:var(--lit-bg);color:var(--lit)}
.tag.tecnico{background:var(--tec-bg);color:var(--tec)}
.tag.late{background:var(--warn-bg);color:var(--warn)}
.qty{color:var(--mute);font-size:.92rem}
.qty.out{color:var(--warn);font-weight:700}
.loanrow{grid-template-columns:1fr auto auto}
.hist{grid-template-columns:auto 1fr}
.empty{padding:32px 16px;text-align:center;color:var(--mute);background:var(--surface);border:1px dashed var(--line);border-radius:8px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:22px;width:min(440px,calc(100% - 24px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 14px;font-size:1.2rem}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.warnbar.info{background:var(--lit-bg);color:var(--lit)}
.warnbar .btn{margin-left:8px;padding:4px 10px}
.warnbar{background:var(--warn-bg);color:var(--warn);padding:10px 14px;border-radius:8px;margin-bottom:14px}
@media (max-width:640px){.row{grid-template-columns:1fr auto}.row .main{grid-column:1/-1}.loanrow{grid-template-columns:1fr auto}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Controle de acervo</h1>
  <p class="sub">Cadastre livros, registre saídas e devoluções e acompanhe tudo por categoria.</p>
  <div id="warn"></div>
  <div class="stats" id="stats"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="acervo" id="t-acervo"></button>
    <button class="tab" role="tab" data-tab="emprestimos" id="t-emprestimos"></button>
    <button class="tab" role="tab" data-tab="historico" id="t-historico">Histórico</button>
  </div>

  <section id="v-acervo">
    <div class="bar">
      <input type="search" id="q" placeholder="Buscar por título ou autor" aria-label="Buscar por título ou autor">
      <div class="pills" id="pills"></div>
      <button class="btn" data-act="add">Adicionar livro</button>
    </div>
    <div id="books"></div>
  </section>
  <section id="v-emprestimos" hidden><div id="loans"></div></section>
  <section id="v-historico" hidden><div id="hist"></div></section>
</div>

<dialog id="dAdd">
  <h2>Adicionar livro</h2>
  <form id="fAdd">
    <div class="field"><label for="aT">Título</label><input id="aT" required maxlength="140"></div>
    <div class="field"><label for="aA">Autor</label><input id="aA" maxlength="100"></div>
    <div class="field"><label for="aC">Categoria</label>
      <select id="aC"><option value="literatura">Literatura</option><option value="tecnico">Técnico</option></select></div>
    <div class="field"><label for="aQ">Exemplares</label><input id="aQ" type="number" min="1" max="999" value="1" required></div>
    <div class="actions"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Salvar livro</button></div>
  </form>
</dialog>

<dialog id="dLend">
  <h2>Registrar saída</h2>
  <form id="fLend">
    <p id="lBook" style="margin:0 0 14px"></p>
    <div class="field"><label for="lW">Nome de quem retirou</label><input id="lW" required maxlength="100"></div>
    <div class="field"><label for="lD">Devolver até</label><input id="lD" type="date" required></div>
    <div class="actions"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Confirmar saída</button></div>
  </form>
</dialog>
<dialog id="dRem"><h2>Lembrete de devolução</h2><p id="remTxt" style="margin:0 0 10px"></p><ul id="remList" style="margin:0 0 14px;padding-left:18px"></ul><div class="actions"><button type="button" class="btn ghost" id="remNotif">Ativar avisos do navegador</button><button type="button" class="btn" data-close>Ok</button></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const titleOf=l=>(bookOf(l.bookId)||{title:'Livro removido'}).title;
const dueToday=()=>{const t=today();return active().filter(l=>l.due===t)};
const dueTomorrow=()=>{const t=plus(1);return active().filter(l=>l.due===t)};
const names=list=>list.slice(0,3).map(l=>esc(titleOf(l))+' ('+esc(l.who)+')').join(', ')+(list.length>3?' e mais '+(list.length-3):'');

function render(){
  const out=active(), late=out.filter(l=>l.due<today()).length;
  const copies=S.books.reduce((a,b)=>a+b.total,0);
  const dt=dueToday(),dm=dueTomorrow();
  $('warn').innerHTML=(saveOk?'':'<div class="warnbar">Não foi possível salvar neste navegador. Os dados podem se perder ao fechar a página.</div>')
    +(dt.length?'<div class="warnbar info">Devolução prevista para hoje: '+names(dt)+'. <button class="btn" data-act="rem">Ver lista</button></div>':'')
    +(dm.length?'<div class="warnbar info">Amanhã vence a devolução de '+names(dm)+'.</div>':'');
  $('stats').innerHTML=`<div><b>${S.books.length}</b><span>títulos</span></div><div><b>${copies}</b><span>exemplares</span></div><div><b>${out.length}</b><span>emprestados</span></div><div class="${late?'late':''}"><b>${late}</b><span>em atraso</span></div>`;
  $('t-acervo').textContent='Acervo ('+S.books.length+')';
  $('t-emprestimos').textContent='Empréstimos ('+out.length+')';
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===view));
  ['acervo','emprestimos','historico'].forEach(v=>$('v-'+v).hidden=v!==view);
  if(view==='acervo')renderBooks();
  if(view==='emprestimos')renderLoans();
  if(view==='historico')renderHist();
  remind();soon();
}

function pager(pages){
  if(pages<2)return '';
  const s=new Set([1,pages,page-2,page-1,page,page+1,page+2].filter(n=>n>=1&&n<=pages));
  let out='',prev=0;
  [...s].sort((a,b)=>a-b).forEach(n=>{if(n-prev>1)out+='<span class="gap">…</span>';out+='<button class="pill" data-act="pg" data-k="'+n+'" aria-pressed="'+(n===page)+'" aria-label="Aba '+n+'">'+n+'</button>';prev=n});
  return '<div class="pager"><button class="pill" data-act="pg" data-k="'+(page-1)+'" '+(page<2?'disabled':'')+'>‹ Anterior</button>'+out+'<button class="pill" data-act="pg" data-k="'+(page+1)+'" '+(page>=pages?'disabled':'')+'>Próxima ›</button></div>';
}

function renderBooks(){
  const n=k=>S.books.filter(b=>k==='todos'||b.cat===k).length;
  $('pills').innerHTML=[['todos','Todos']].concat(Object.entries(CATS)).map(([k,l])=>`<button class="pill" data-act="cat" data-k="${k}" aria-pressed="${cat===k}">${l} (${n(k)})</button>`).join('');
  const nq=norm(q);
  const list=S.books.filter(b=>(cat==='todos'||b.cat===cat)&&(!nq||norm(b.title+' '+b.author).includes(nq))).sort((a,b)=>a.title.localeCompare(b.title,'pt-BR'));
  if(!S.books.length){$('books').innerHTML='<div class="empty">Nenhum livro cadastrado ainda. Use “Adicionar livro” para começar o acervo.</div>';return}
  if(!list.length){$('books').innerHTML='<div class="empty">Nenhum livro encontrado com esse filtro.</div>';return}
  const pages=Math.ceil(list.length/PER);if(page>pages)page=pages;if(page<1)page=1;
  const from=(page-1)*PER,shown=list.slice(from,from+PER);
  $('books').innerHTML=(pages>1?'<p class="by" style="margin:0 0 4px">Aba '+page+' de '+pages+' · livros '+(from+1)+' a '+(from+shown.length)+' de '+list.length+'</p>'+pager(pages):'')+'<ul class="list">'+shown.map(b=>`<li class="row ${b.cat}"><div class="main"><strong>${esc(b.title)}</strong><span class="by">${esc(b.author||'Autor não informado')}</span></div><span class="tag ${b.cat}">${CATS[b.cat]}</span><span class="qty ${b.avail?'':'out'}">${b.avail} de ${b.total} disponíveis</span><button class="btn" data-act="lend" data-id="${b.id}" ${b.avail?'':'disabled'}>Registrar saída</button></li>`).join('')+'</ul>'+pager(pages);
}

function renderLoans(){
  const list=active().sort((a,b)=>a.due.localeCompare(b.due));
  if(!list.length){$('loans').innerHTML='<div class="empty">Nenhum livro emprestado no momento.</div>';return}
  $('loans').innerHTML='<ul class="list">'+list.map(l=>{
    const b=bookOf(l.bookId)||{title:'Livro removido',cat:'literatura'}, isLate=l.due<today();
    return `<li class="row loanrow ${isLate?'late':b.cat}"><div class="main"><strong>${esc(b.title)}</strong><span class="by">${esc(l.who)} · saiu em ${fd(l.out)} · devolver até ${fd(l.due)}</span></div>${isLate?'<span class="tag late">Atrasado</span>':'<span class="tag '+b.cat+'">'+CATS[b.cat]+'</span>'}<button class="btn" data-act="ret" data-id="${l.id}">Registrar devolução</button></li>`}).join('')+'</ul>';
}

function renderHist(){
  const ev=[];
  S.loans.forEach(l=>{const t=titleOf(l);
    ev.push({t:l.out,txt:`Saída: <strong>${esc(t)}</strong> para ${esc(l.who)}`});
    if(l.ret)ev.push({t:l.ret,txt:`Devolução: <strong>${esc(t)}</strong> por ${esc(l.who)}`})});
  ev.sort((a,b)=>b.t.localeCompare(a.t));
  if(!ev.length){$('hist').innerHTML='<div class="empty">As saídas e devoluções aparecem aqui.</div>';return}
  $('hist').innerHTML='<ul class="list">'+ev.slice(0,150).map(e=>`<li class="row hist"><span class="by">${fd(e.t)}</span><span>${e.txt}</span></li>`).join('')+'</ul>';
}

/* Lembretes de devolução */
const SLOTS=[7,9,11,13];
function slotAt(d){const hr=d.getHours();if(hr<7||hr>13)return null;return SLOTS.filter(s=>hr>=s).pop()}
let shownKey='',soonDay='';
function remind(force){
  const list=dueToday();
  if(!list.length)return;
  const sl=slotAt(new Date());
  if(sl===null&&!force)return;
  const k=today()+'-'+sl;
  let seen='';try{seen=localStorage.getItem('bib-lembrete')||''}catch(e){}
  if(!force&&(seen===k||shownKey===k))return;
  shownKey=k;try{localStorage.setItem('bib-lembrete',k)}catch(e){}
  const hora=sl===null?'':' ('+p2(sl)+':00)';
  $('remTxt').textContent='Hoje é o prazo de devolução de '+list.length+(list.length>1?' livros':' livro')+hora+':';
  $('remList').innerHTML=list.map(l=>'<li><strong>'+esc(titleOf(l))+'</strong> — '+esc(l.who)+'</li>').join('');
  $('remNotif').hidden=!('Notification' in window)||Notification.permission==='granted';
  if(!$('dRem').open)$('dRem').showModal();
  try{if('Notification' in window&&Notification.permission==='granted')new Notification('Devolução de livros hoje',{body:list.length+(list.length>1?' livros vencem':' livro vence')+' hoje.'})}catch(e){}
}
function soon(){
  const dm=dueTomorrow();if(!dm.length)return;
  const t=today();let seen='';try{seen=localStorage.getItem('bib-aviso-amanha')||''}catch(e){}
  if(seen===t||soonDay===t)return;
  soonDay=t;try{localStorage.setItem('bib-aviso-amanha',t)}catch(e){}
  toast('Amanhã vence a devolução de '+dm.length+(dm.length>1?' livros':' livro')+'.');
}
$('remNotif').addEventListener('click',()=>{try{Notification.requestPermission().then(p=>{toast(p==='granted'?'Avisos do navegador ativados':'Permissão negada');$('remNotif').hidden=p==='granted'})}catch(e){toast('Este navegador não permite avisos aqui')}});

document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');if(tab){view=tab.dataset.tab;render();return}
  if(e.target.closest('[data-close]')){e.target.closest('dialog').close();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act==='cat'){cat=el.dataset.k;page=1;render()}
  if(act==='pg'){page=+el.dataset.k;renderBooks();$('v-acervo').scrollIntoView({block:'start'})}
  if(act==='add'){$('fAdd').reset();$('dAdd').showModal();$('aT').focus()}
  if(act==='lend'){const b=bookOf(el.dataset.id);if(!b||!b.avail)return;lendId=b.id;$('lBook').innerHTML='Livro: <strong>'+esc(b.title)+'</strong>';$('fLend').reset();$('lD').value=plus(14);$('dLend').showModal();$('lW').focus()}
  if(act==='ret'){const l=S.loans.find(x=>x.id===el.dataset.id);if(!l||l.ret)return;l.ret=new Date().toISOString();const b=bookOf(l.bookId);if(b)b.avail=Math.min(b.total,b.avail+1);save();render();toast('Devolução registrada')}
  if(act==='rem')remind(true);
});
$('q').addEventListener('input',e=>{q=e.target.value;page=1;renderBooks()});

$('fAdd').addEventListener('submit',e=>{
  e.preventDefault();
  const title=$('aT').value.trim(),author=$('aA').value.trim(),c=$('aC').value,n=Math.max(1,parseInt($('aQ').value,10)||1);
  if(!title)return;
  const dup=S.books.find(b=>norm(b.title)===norm(title)&&norm(b.author||'')===norm(author)&&b.cat===c);
  if(dup){dup.total+=n;dup.avail+=n;toast('Livro já cadastrado: exemplares somados')}
  else{S.books.push({id:uid(),title,author,cat:c,total:n,avail:n});toast('Livro adicionado ao acervo')}
  save();$('dAdd').close();page=1;cat='todos';q='';$('q').value='';view='acervo';render();
});

$('fLend').addEventListener('submit',e=>{
  e.preventDefault();
  const b=bookOf(lendId),who=$('lW').value.trim(),due=$('lD').value;
  if(!b||!b.avail||!who||!due)return;
  b.avail--;S.loans.push({id:uid(),bookId:b.id,who,out:new Date().toISOString(),due,ret:null});
  save();$('dLend').close();render();toast('Saída registrada');
});

save();render();
setInterval(remind,30000);setInterval(soon,60000);
</script>
</body>
